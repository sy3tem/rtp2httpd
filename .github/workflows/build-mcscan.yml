name: build mcscan

on:
  workflow_dispatch:
  push:
    paths:
      - "scan/**"

jobs:
  aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # zig ships a complete musl cross toolchain, so no apt-get is involved
      # (the hosted runner's apt mirror is frequently slow/hanging).
      - name: Install zig
        run: |
          python3 -m pip install --quiet ziglang
          python3 -m ziglang version

      - name: Build static aarch64 binary
        run: |
          python3 -m ziglang cc -target aarch64-linux-musl -O2 -Wall -Wextra \
            -static -o mcscan scan/mcscan.c
          file mcscan
          ls -lh mcscan

      - uses: actions/upload-artifact@v4
        with:
          name: mcscan-aarch64
          path: mcscan
