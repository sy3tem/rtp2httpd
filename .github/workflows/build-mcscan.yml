name: build mcscan

on:
  workflow_dispatch:
  push:
    paths:
      - "scan/**"

jobs:
  aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build static aarch64 binary
        run: |
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -static -pthread \
            -o mcscan scan/mcscan.c
          file mcscan
          ls -lh mcscan

      - uses: actions/upload-artifact@v4
        with:
          name: mcscan-aarch64
          path: mcscan
